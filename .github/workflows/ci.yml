name: CI - Lint, Test & Container Build

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Code Quality & Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Check code formatting (Black)
        run: |
          black --check .

      - name: Lint and enforce style (Ruff)
        run: |
          ruff check .

      - name: Ensure test fixtures and baseline artifacts
        run: |
          python -m scripts.generate_test_fixtures

      - name: Execute test suite (Pytest)
        run: |
          pytest -v

      - name: Archive model artifacts for Docker packaging
        uses: actions/upload-artifact@v4
        with:
          name: baseline-artifacts
          path: artifacts/
          retention-days: 1

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download model artifacts from quality gate
        uses: actions/download-artifact@v4
        with:
          name: baseline-artifacts
          path: artifacts/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Serving Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mlops-serving:ci-test

