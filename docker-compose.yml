services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.2
    container_name: mlops-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:29092,external://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -i healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: mlops-redpanda-console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "redpanda:29092"
    depends_on:
      redpanda:
        condition: service_healthy

  traefik:
    image: traefik:v3.0
    container_name: mlops-traefik
    command:
      - --api.insecure=true
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entryPoints.web.address=:80
    ports:
      - "80:80"
      - "8081:8080" # Traefik dashboard
    volumes:
      - ./config/traefik_dynamic.yml:/etc/traefik/dynamic.yml
    depends_on:
      - serving-prod

  serving-prod:
    build:
      context: .
      dockerfile: Dockerfile
    image: mlops-serving:latest
    container_name: mlops-serving-prod
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - MODEL_DIR=/app/artifacts/models
      - MOBILITY_MODEL_DIR=/app/artifacts/mobility
    ports:
      - "8001:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  serving-canary:
    build:
      context: .
      dockerfile: Dockerfile
    image: mlops-serving:latest
    container_name: mlops-serving-canary
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - MODEL_DIR=/app/artifacts/canary
      - MOBILITY_MODEL_DIR=/app/artifacts/canary
    ports:
      - "8002:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  redpanda_data:
